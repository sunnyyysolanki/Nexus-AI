# Render Blueprint Specification for NEXUS AI Infrastructure
# Docs: https://render.com/docs/blueprint-spec

services:
  # -------------------------------------------------------------
  # 1. Apache Kafka (Web Service on Free Plan)
  # -------------------------------------------------------------
  - type: web
    name: nexus-kafka
    plan: free
    runtime: image
    image:
      url: apache/kafka:latest
    envVars:
      - key: KAFKA_NODE_ID
        value: "1"
      - key: KAFKA_PROCESS_ROLES
        value: "broker,controller"
      - key: KAFKA_LISTENERS
        value: "PLAINTEXT://:9092,CONTROLLER://:9093"
      - key: KAFKA_ADVERTISED_LISTENERS
        value: "PLAINTEXT://nexus-kafka:9092"
      - key: KAFKA_CONTROLLER_LISTENER_NAMES
        value: "CONTROLLER"
      - key: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
        value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      - key: KAFKA_CONTROLLER_QUORUM_VOTERS
        value: "1@127.0.0.1:9093"
      - key: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
        value: "1"
      - key: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
        value: "1"
      - key: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
        value: "1"
      - key: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
        value: "0"
      - key: CLUSTER_ID
        value: "NEXUS_KAFKA_CLUSTER_00"

  # -------------------------------------------------------------
  # 2. Kafka UI Dashboard
  # -------------------------------------------------------------
  - type: web
    name: nexus-kafka-ui
    plan: free
    runtime: image
    image:
      url: provectuslabs/kafka-ui:latest
    envVars:
      - key: SERVER_PORT
        value: "8080"
      - key: KAFKA_CLUSTERS_0_NAME
        value: nexus-cluster
      - key: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
        value: "nexus-kafka:9092"

  # -------------------------------------------------------------
  # 3. Log Service Microservice
  # -------------------------------------------------------------
  - type: web
    name: log-service
    plan: free
    runtime: docker
    rootDir: backend/services/log-service
    dockerfilePath: Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: nexus-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: nexus-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: nexus-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: nexus-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: nexus-db
          property: password

  # -------------------------------------------------------------
  # 4. Metric Service Microservice
  # -------------------------------------------------------------
  - type: web
    name: metric-service
    plan: free
    runtime: docker
    rootDir: backend/services/metric-service
    dockerfilePath: Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: nexus-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: nexus-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: nexus-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: nexus-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: nexus-db
          property: password

  # -------------------------------------------------------------
  # 5. RCA Service Microservice (LLM + VectorDB Cache)
  # -------------------------------------------------------------
  - type: web
    name: rca-service
    plan: free
    runtime: docker
    rootDir: backend/services/rca-service
    dockerfilePath: Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: nexus-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: nexus-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: nexus-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: nexus-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: nexus-db
          property: password

  # -------------------------------------------------------------
  # 6. Incident Service Microservice
  # -------------------------------------------------------------
  - type: web
    name: incident-service
    plan: free
    runtime: docker
    rootDir: backend/services/incident-service
    dockerfilePath: Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: nexus-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: nexus-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: nexus-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: nexus-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: nexus-db
          property: password

  # -------------------------------------------------------------
  # 7. Alert Service Microservice
  # -------------------------------------------------------------
  - type: web
    name: alert-service
    plan: free
    runtime: docker
    rootDir: backend/services/alert-service
    dockerfilePath: Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: nexus-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: nexus-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: nexus-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: nexus-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: nexus-db
          property: password

  # -------------------------------------------------------------
  # 8. API Gateway
  # -------------------------------------------------------------
  - type: web
    name: api-gateway
    plan: free
    runtime: docker
    rootDir: backend/services/api-gateway
    dockerfilePath: Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

databases:
  # -------------------------------------------------------------
  # 9. Render Managed PostgreSQL Database (Includes pgvector!)
  # -------------------------------------------------------------
  - name: nexus-db
    databaseName: nexus_db
    plan: free
