# Render Blueprint Specification for NEXUS AI Infrastructure
# Docs: https://render.com/docs/blueprint-spec

services:
  # -------------------------------------------------------------
  # 1. Apache Kafka (KRaft mode)
  # -------------------------------------------------------------
  - type: pserv
    name: nexus-kafka
    env: image
    image:
      url: apache/kafka:latest
    envVars:
      - key: KAFKA_NODE_ID
        value: "1"
      - key: KAFKA_PROCESS_ROLES
        value: "broker,controller"
      - key: KAFKA_LISTENERS
        value: "PLAINTEXT://:9092,CONTROLLER://:9093"
      - key: KAFKA_ADVERTISED_LISTENERS
        value: "PLAINTEXT://nexus-kafka:9092"
      - key: KAFKA_CONTROLLER_LISTENER_NAMES
        value: "CONTROLLER"
      - key: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
        value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      - key: KAFKA_CONTROLLER_QUORUM_VOTERS
        value: "1@nexus-kafka:9093"
      - key: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
        value: "1"
      - key: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
        value: "1"
      - key: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
        value: "1"
      - key: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
        value: "0"

  # -------------------------------------------------------------
  # 2. Kafka UI Dashboard
  # -------------------------------------------------------------
  - type: web
    name: nexus-kafka-ui
    env: image
    image:
      url: provectuslabs/kafka-ui:latest
    envVars:
      - key: SERVER_PORT
        value: "8080"
      - key: KAFKA_CLUSTERS_0_NAME
        value: nexus-cluster
      - key: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
        value: "nexus-kafka:9092"

  # -------------------------------------------------------------
  # 3. Log Service Microservice
  # -------------------------------------------------------------
  - type: web
    name: log-service
    env: docker
    dockerfilePath: backend/services/log-service/Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

  # -------------------------------------------------------------
  # 4. Metric Service Microservice
  # -------------------------------------------------------------
  - type: web
    name: metric-service
    env: docker
    dockerfilePath: backend/services/metric-service/Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

  # -------------------------------------------------------------
  # 5. RCA Service Microservice
  # -------------------------------------------------------------
  - type: web
    name: rca-service
    env: docker
    dockerfilePath: backend/services/rca-service/Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

  # -------------------------------------------------------------
  # 6. Incident Service Microservice
  # -------------------------------------------------------------
  - type: web
    name: incident-service
    env: docker
    dockerfilePath: backend/services/incident-service/Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

  # -------------------------------------------------------------
  # 7. Alert Service Microservice
  # -------------------------------------------------------------
  - type: web
    name: alert-service
    env: docker
    dockerfilePath: backend/services/alert-service/Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

  # -------------------------------------------------------------
  # 8. API Gateway
  # -------------------------------------------------------------
  - type: web
    name: api-gateway
    env: docker
    dockerfilePath: backend/services/api-gateway/Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

databases:
  # -------------------------------------------------------------
  # 9. Render Managed PostgreSQL Database (Includes pgvector!)
  # -------------------------------------------------------------
  - name: nexus-db
    databaseName: nexus_db
