spring:
  application:
    name: alert-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nexus_alert_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:8083}

# Internal service URLs — set via environment variables in production
services:
  incident-url: ${INCIDENT_SERVICE_URL:http://localhost:8084}

# Nexus starter config
nexus:
  service-name: alert-service
  internal-token: ${INTERNAL_SERVICE_TOKEN:}
