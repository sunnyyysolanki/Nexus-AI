server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # CORS is handled here at the gateway — individual services must NOT set @CrossOrigin
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            exposedHeaders:
              - Authorization
              - Content-Type
            allowCredentials: false
            maxAge: 3600

      default-filters:
        # Strip duplicate CORS headers that downstream services might add
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
        # Stamp every forwarded request with the shared internal secret
        # Services reject any request missing this header (direct bypass attempts get 403)
        - AddRequestHeader=X-Internal-Token, ${INTERNAL_SERVICE_TOKEN:}

      routes:
        # Route 1: Alert Ingestion -> alert-service
        - id: alert-service-route
          uri: ${ALERT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/alerts, /api/v1/alerts/**

        # Route 2: Incident Management -> incident-service
        - id: incident-service-route
          uri: ${INCIDENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/incidents, /api/v1/incidents/**

        # Route 3: Log Ingestion & Search -> log-service
        - id: log-service-route
          uri: ${LOG_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/logs, /api/v1/logs/**

        # Route 4: Metric Ingestion & Query -> metric-service
        - id: metric-service-route
          uri: ${METRIC_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/metrics, /api/v1/metrics/**

        # Route 5: AI RCA Generation -> rca-service
        - id: rca-service-route
          uri: ${RCA_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/rca, /api/v1/rca/**

        # Health check proxy routes — frontend calls these through gateway (avoids CORS issues)
        - id: health-alert
          uri: ${ALERT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/health/alert
          filters:
            - RewritePath=/api/health/alert, /actuator/health

        - id: health-incident
          uri: ${INCIDENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/health/incident
          filters:
            - RewritePath=/api/health/incident, /actuator/health

        - id: health-log
          uri: ${LOG_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/health/log
          filters:
            - RewritePath=/api/health/log, /actuator/health

        - id: health-metric
          uri: ${METRIC_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/health/metric
          filters:
            - RewritePath=/api/health/metric, /actuator/health

        - id: health-rca
          uri: ${RCA_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/health/rca
          filters:
            - RewritePath=/api/health/rca, /actuator/health

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always