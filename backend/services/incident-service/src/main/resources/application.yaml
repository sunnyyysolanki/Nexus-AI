spring:
  application:
    name: incident-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nexus_incident_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:}
      sasl.jaas.config: ${KAFKA_JAAS_CONFIG:}
      ssl.endpoint.identification.algorithm: ${KAFKA_SSL_ENDPOINT_ALGORITHM:}
      ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PEM}
      ssl.truststore.certificates: ${KAFKA_SSL_CA_CERT:}
      spring.json.trusted.packages: "com.nexus.*"
      spring.json.type.mapping: >
        RcaRequest:com.nexus.incident.dto.RcaRequest,
        RcaResponse:com.nexus.incident.dto.RcaResponse,
        IncidentCreatedEvent:com.nexus.incident.event.IncidentCreatedEvent
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: incident-group-v4
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer

server:
  port: ${PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

# Internal service URLs — override via environment variables in production
services:
  log-url: ${LOG_SERVICE_URL:http://localhost:8081}
  metric-url: ${METRIC_SERVICE_URL:http://localhost:8082}

# Nexus starter config
nexus:
  service-name: incident-service
  internal-token: ${INTERNAL_SERVICE_TOKEN:}
