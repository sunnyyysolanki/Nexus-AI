spring:
  application:
    name: rca-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:nexus_rca_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Assassin@s4u}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:}
      sasl.jaas.config: ${KAFKA_JAAS_CONFIG:}
      ssl.endpoint.identification.algorithm: ${KAFKA_SSL_ENDPOINT_ALGORITHM:}
      ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PEM}
      ssl.truststore.certificates: ${KAFKA_SSL_CA_CERT:}
      spring.json.trusted.packages: "com.nexus.*"
      spring.json.type.mapping: "RcaRequest:com.nexus.rca_service.dto.RcaRequest,RcaResponse:com.nexus.rca_service.dto.RcaResponse,com.nexus.incident.dto.RcaRequest:com.nexus.rca_service.dto.RcaRequest"
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: rca-group-v4
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer

  ai:
    openai:
      base-url: ${AI_BASE_URL:http://localhost:11434/v1}
      api-key: ${AI_API_KEY:ollama}
      chat:
        model: ${AI_MODEL:minicpm-v4.6}
        temperature: 0.2
      embedding:
        base-url: ${AI_EMBEDDING_BASE_URL:http://localhost:11434/v1}
        api-key: ${AI_EMBEDDING_API_KEY:ollama}
        model: ${AI_EMBEDDING_MODEL:nomic-embed-text}

    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: ${VECTOR_DIMENSIONS:1024}
        distance-type: COSINE_DISTANCE
        index-type: HNSW


    mcp:
      client:
        stdio:
          servers-configuration: classpath:mcp-servers.json

server:
  port: ${PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG

# Nexus starter config
nexus:
  service-name: rca-service
  internal-token: ${INTERNAL_SERVICE_TOKEN:}
